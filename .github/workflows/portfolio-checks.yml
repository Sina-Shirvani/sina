name: Portfolio checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload Playwright and axe reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
